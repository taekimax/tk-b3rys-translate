<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=360" />
    <link rel="stylesheet" href="./style.css" />
    <title>b3rys translate</title>
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <div class="title-group">
          <h1 class="title">b3rys <span class="title-accent">translate</span></h1>
          <span class="version">Local MLX</span>
        </div>
      </header>
      <div id="local-error-banner" class="error-banner" style="display: none">
        <span id="local-error-message" class="error-banner-text"></span
        ><button id="dismiss-error" class="error-banner-dismiss">&times;</button>
      </div>
      <div class="divider"></div>
      <section class="section section-engine">
        <label class="label" for="model-select"
          ><span class="label-text">로컬 모델</span
          ><span class="info-tooltip" id="model-tooltip"></span></label
        ><select id="model-select" class="select"></select>
        <div class="model-status-row">
          <span id="local-host-status" class="cache-hint"></span
          ><button id="check-models" class="btn-small" type="button">상태 확인</button>
        </div>
        <div id="model-install-guide" class="install-guide" hidden>
          <strong id="model-install-title" role="alert">모델을 다운로드할까요?</strong>
          <span id="model-install-path" class="cache-hint"></span>
          <div class="install-actions">
            <button id="download-selected-model" class="btn-small" type="button">
              다운로드 시작
            </button>
            <a id="open-model-page" class="btn-small" target="_blank" rel="noreferrer">모델 정보</a>
          </div>
          <span class="cache-hint">다운로드가 완료되면 선택한 모델로 바로 번역할 수 있습니다.</span>
        </div>
        <div id="model-download-progress" class="download-progress" hidden aria-live="polite">
          <div class="download-progress-heading">
            <strong id="model-download-title">모델 다운로드 준비 중</strong>
            <span id="model-download-percent">준비 중</span>
          </div>
          <div
            id="model-download-track"
            class="download-progress-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-labelledby="model-download-title"
          >
            <div id="model-download-bar" class="download-progress-bar"></div>
          </div>
          <span id="model-download-detail" class="cache-hint"></span>
          <span id="model-download-queue" class="cache-hint" hidden></span>
        </div>
      </section>
      <section class="section">
        <label class="label" for="target-lang"><span class="label-text">번역 언어</span></label
        ><select id="target-lang" class="select"></select>
      </section>
      <section class="section">
        <label class="label"><span class="label-text">표시 버튼</span></label>
        <div class="toggle-pair">
          <label class="toggle-row">플로팅 <input type="checkbox" id="fab-toggle" /></label
          ><label class="toggle-row">YouTube <input type="checkbox" id="yt-btn-toggle" /></label
          ><label class="toggle-row">자동 <input type="checkbox" id="auto-toggle" /></label>
        </div>
        <span class="cache-hint"
          >번역은 이 Mac에서 처리됩니다. 텍스트는 외부 번역 서비스로 전송되지 않습니다.</span
        >
      </section>
      <div class="divider"></div>
      <section class="section">
        <div class="cache-row">
          <span class="label-text">번역 캐시</span
          ><button id="cache-clear" class="btn-cache-clear">지우기</button>
        </div>
      </section>
      <footer class="footer">
        <div class="engine-badge">
          <span>EN →</span><span class="badge-separator">·</span><span class="badge-model"></span>
        </div>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
