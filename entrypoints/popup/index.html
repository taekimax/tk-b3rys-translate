<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=360" />
    <link rel="stylesheet" href="./style.css" />
    <title>b3rys translate</title>
  </head>
  <body>
    <div class="popup">
      <header class="header">
        <div class="title-group">
          <h1 class="title">b3rys <span class="title-accent">translate</span></h1>
          <span class="version">Local MLX</span>
        </div>
      </header>
      <div id="local-error-banner" class="error-banner" style="display: none">
        <span id="local-error-message" class="error-banner-text"></span
        ><button id="dismiss-error" class="error-banner-dismiss">&times;</button>
      </div>
      <div class="divider"></div>
      <section class="section section-engine">
        <label class="label" for="model-select"
          ><span class="label-text">Local model</span
          ><span class="info-tooltip" id="model-tooltip"></span></label
        ><select id="model-select" class="select"></select>
        <div class="model-status-row">
          <span id="local-host-status" class="cache-hint"></span
          ><button id="check-models" class="btn-small" type="button">Check</button>
        </div>
        <div id="model-install-guide" class="install-guide" hidden>
          <strong id="model-install-title">Model files are missing</strong>
          <span id="model-install-path" class="cache-hint"></span>
          <code id="model-install-command" class="install-command"></code>
          <div class="install-actions">
            <button id="copy-model-command" class="btn-small" type="button">Copy command</button>
            <a id="open-model-page" class="btn-small" target="_blank" rel="noreferrer"
              >Open model page</a
            >
          </div>
          <span class="cache-hint"
            >Install the Hugging Face CLI first if needed:
            <code>python3 -m pip install --user huggingface_hub</code></span
          >
        </div>
      </section>
      <section class="section">
        <label class="label" for="target-lang"><span class="label-text">Translate to</span></label
        ><select id="target-lang" class="select"></select>
      </section>
      <section class="section">
        <label class="label"><span class="label-text">Buttons</span></label>
        <div class="toggle-pair">
          <label class="toggle-row">Floating <input type="checkbox" id="fab-toggle" /></label
          ><label class="toggle-row">YouTube <input type="checkbox" id="yt-btn-toggle" /></label
          ><label class="toggle-row">Auto <input type="checkbox" id="auto-toggle" /></label>
        </div>
        <span class="cache-hint"
          >All inference stays on this Mac. No API key or cloud route is available.</span
        >
      </section>
      <div class="divider"></div>
      <section class="section">
        <div class="cache-row">
          <span class="label-text">Cache</span
          ><button id="cache-clear" class="btn-cache-clear">Clear</button>
        </div>
      </section>
      <footer class="footer">
        <div class="engine-badge">
          <span>EN →</span><span class="badge-separator">·</span><span class="badge-model"></span>
        </div>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
